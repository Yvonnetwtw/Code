on.y=i%2?0:Math.PI}const tea=group(b,-.6,.5,.1);cyl(tea,0xf0e1c3,.12,.08,.2,0,.1,0);cyl(tea,0x8c9b6b,.09,.09,.01,0,.205,0);hot(tea,()=>gate(async()=>{audio.qin();await tween(b.position,{x:.6,duration:1.6,ease:'sine.inOut'});await bounce(zhu);done('諸葛亮：不急不躁，喝杯茶吧。善用天時與逆向思考，小船滿載十萬支箭回航。')}))}}}
else{box(p,0xb7c4b9,7.4,.07,4.15,0,.02,0);const {g,doors}=city(p);const zhu=character(g,'諸葛亮',0xc4d5d3,0,.02,true);zhu.position.y=1.87;zhu.scale.setScalar(.67);const qin=group(g,0,1.99,.57);box(qin,0x785449,1.1,.12,.3);for(let i=0;i<7;i++)box(qin,0xe8c994,1.03,.009,.008,0,.068,-.11+i*.035);if(page===0){const kids=[character(p,'書僮',0xabc2a0,-.62,.45),character(p,'書僮',0xd4b594,.62,.45)];kids.forEach(k=>{k.scale.setScalar(.001);const broom=group(k,.4,.2,.2);stick(broom,0x96794f,[0,0,0],[0,.75,0],.03);const br=mesh(broom,new THREE.ConeGeometry(.15,.3,7),0xc4ab75,0,0,0);k.userData.broom=broom});const open=()=>gate(async()=>{audio.paper();await Promise.all(doors.map((d,i)=>tween(d.rotation,{y:i===0?-Math.PI*.7:Math.PI*.7,duration:1.5,ease:'power2.inOut'})));await Promise.all(kids.map(k=>tween(k.scale,{x:.6,y:.6,z:.6,duration:.8,ease:'back.out(2)'})));await Promise.all(kids.map(k=>tween(k.userData.broom.rotation,{z:.6,duration:.4,yoyo:true,repeat:3})));done('城門大開，書僮不慌不忙地掃地。這份安靜，讓來敵開始遲疑。')});doors.forEach(d=>hot(d,open))}else{doors[0].rotation.y=-Math.PI*.7;doors[1].rotation.y=Math.PI*.7;if(page===1){hot(qin,()=>gate(async()=>{audio.qin();await Promise.all(zhu.userData.arms.map((a,i)=>tween(a.rotation,{x:-.5,z:i?.3:-.3,duration:.3,yoyo:true,repeat:5})));done('琴音緩緩流動。保持冷靜，不是沒有害怕，而是在害怕時仍能好好思考。')}));hot(zhu,()=>qin.userData.action())}else{const si=character(p,'司馬懿',0x8c9aaa,0,1.5,true);si.scale.setScalar(.8);const army=[];for(let i=0;i<8;i++){const a=character(p,'士兵',0x849197,-2.8+(i%4)*.75,1.45+Math.floor(i/4)*.45);a.scale.setScalar(.42);army.push(a)}hot(si,()=>gate(async()=>{await bounce(si);say('司馬懿：如此沉著，莫非有埋伏？先退兵，再做打算。');await tween(si.userData.arms[1].rotation,{z:-1.8,duration:.4});await Promise.all([si,...army].map((a,i)=>tween(a.position,{x:4.5,z:2.8,duration:1.7,delay:i*.09,ease:'power1.in'})));[si,...army].forEach(a=>a.visible=false);done('軍隊漸漸遠去，西城化險為夷。面對困難，先把心安定下來。')}))}}}

books.forEach((b,i)=>{const el=document.createElement('button');el.className='tab';el.textContent=b.title;el.onclick=()=>{if(state==='BOOKSHELF')selectBook(i)};$('#selector').append(el)});
async function selectBook(i){if(state!=='BOOKSHELF'||locked)return;await gate(async()=>{bookIndex=i;page=0;setState('BOOK_ZOOM');$('#selector').hidden=true;$('#title').textContent=books[i].title;say('把書輕輕打開，故事就要開始了。');$('#hint').textContent='請稍候，繪本正在展開…';const flying=shelfBooks[i];await Promise.all([tween(flying.position,{x:0,y:1,z:5.9,duration:1.3,ease:'power2.inOut'}),tween(flying.rotation,{x:-Math.PI/2,duration:1.3,ease:'power2.inOut'}),cameraTo([0,7.7,12],[0,.8,1.2],1.5)]);flying.visible=false;volume.visible=true;cover.remove(coverTitle);coverTitle.geometry.dispose();coverTitle.material.map.dispose();coverTitle.material.dispose();coverTitle=textMesh(cover,books[i].title,2,.06,0,.65,'#fff1d3');coverTitle.rotation.x=-Math.PI/2;base.material=mat(books[i].color);cover.children[0].material=mat(books[i].color);cover.rotation.z=0;setState('OPEN_COVER');audio.paper();await tween(cover.rotation,{z:Math.PI,duration:1.3,ease:'power2.inOut'});await buildScene();audio.pop();setState('SCENE_INTERACTION')})}
$('#next').onclick=()=>{if(state!=='SCENE_INTERACTION'||!completed||locked)return;gate(async()=>{if(page===2){setState('QUIZ');showQuiz();return}setState('PAGE_TURN');audio.paper();await cameraTo([0,7.7,12],[0,1,1.2],.65);await tween(current.scale,{x:.7,y:.001,z:.001,duration:.65,ease:'power2.in'});clearScene();paper.visible=true;paper.rotation.z=0;await tween(paper.rotation,{z:Math.PI,duration:1.05,ease:'power2.inOut'});paper.visible=false;page++;await buildScene();audio.pop();if(bookIndex===2&&page===1)await cameraTo([0,5.8,8.5],[0,2.6,.65],1.5);setState('SCENE_INTERACTION')})};

async function returnShelf(){if(locked||!['ENDING','SCENE_INTERACTION'].includes(state))return;await gate(async()=>{$('#modal').hidden=true;audio.paper();if(current){await tween(current.scale,{x:.1,y:.001,z:.001,duration:.5});clearScene()}await tween(cover.rotation,{z:0,duration:.75,ease:'power2.inOut'});volume.visible=false;const b=shelfBooks[bookIndex];b.visible=true;await Promise.all([tween(b.position,{x:(bookIndex-1)*3,y:2.18,z:.05,duration:1.2,ease:'power2.inOut'}),tween(b.rotation,{x:0,duration:1.2}),cameraTo([0,6.8,15],[0,2,-1],1.4)]);setState('BOOKSHELF');$('#selector').hidden=false;$('#eyebrow').textContent='從一頁，走進三國';$('#title').textContent='今晚，想讀哪一個故事？';say('挑選一本書，讓小小的世界在掌心展開。');$('#hint').textContent='點擊書架上的繪本，或上方書名。'})}$('#back').onclick=returnShelf;$('#finish').onclick=returnShelf;

const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();function hit(event,groups){const r=renderer.domElement.getBoundingClientRect();pointer.set((event.clientX-r.left)/r.width*2-1,-(event.clientY-r.top)/r.height*2+1);ray.setFromCamera(pointer,camera);const hits=ray.intersectObjects(groups,true);for(const h of hits){let o=h.object;while(o){if(groups.includes(o))return o;o=o.parent}}return null}let down=null;renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY}});renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>8)return;down=null;if(locked||free)return;if(state==='BOOKSHELF'){const g=hit(e,shelfBooks);if(g)selectBook(g.userData.book)}else if(state==='SCENE_INTERACTION'){const g=hit(e,hotspots);if(g)g.userData.action()}});renderer.domElement.addEventListener('pointermove',e=>{const g=!locked&&!free&&hit(e,state==='BOOKSHELF'?shelfBooks:state==='SCENE_INTERACTION'?hotspots:[]);renderer.domElement.style.cursor=g?'pointer':'default'});
// A screen-space, softly fading glow trail. No texture files are used.
const tc=$('#trail'),ctx=tc.getContext('2d'),sparks=[];let lastTrail=0;document.addEventListener('pointermove',e=>{if(performance.now()-lastTrail<24)return;lastTrail=performance.now();sparks.push({x:e.clientX,y:e.clientY,life:1,r:3+Math.random()*4})});function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.fov=w/h<.8?53:38;camera.updateProjectionMatrix();tc.width=w;tc.height=h}addEventListener('resize',resize);resize();let time=0;const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);time+=dt;if(!free)camera.lookAt(target);else controls.update();for(const f of floaters)if(!locked)f.g.position.y=f.base+Math.sin(time*f.speed+f.phase)*f.amp;for(const p of petals){p.position.y-=dt*.16;p.position.x+=Math.sin(time+p.id)*dt*.035;if(p.position.y<.08)p.position.y=2.8}ctx.clearRect(0,0,tc.width,tc.height);for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.life-=dt*1.7;if(s.life<=0){sparks.splice(i,1);continue}const gr=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*3);gr.addColorStop(0,`rgba(255,241,189,${s.life*.65})`);gr.addColorStop(1,'rgba(255,241,189,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(s.x,s.y,s.r*3,0,Math.PI*2);ctx.fill()}renderer.render(scene,camera)}sync();frame();$('#loading').classList.add('hide');
